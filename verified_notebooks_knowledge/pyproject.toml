[project]
name = "halo-rag-studio"
version = "0.1.0"
description = "HALO RAG Studio: Autonomous Multi-Agent & Modular RAG Engine on Google Antigravity"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lead AI Systems Architect", email = "architect@antigravity.internal" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]
llm = [
    "litellm>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
